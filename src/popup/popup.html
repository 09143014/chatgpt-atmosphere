<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Atmosphere</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="topbar">
        <div>
          <h1>Atmosphere</h1>
          <p id="currentSlot">读取中</p>
        </div>
        <label class="switch" title="启用或关闭壁纸">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </section>

      <section class="preview" id="preview">
        <span id="previewName">未选择壁纸</span>
      </section>

      <section class="controls">
        <label>
          模式
          <select id="mode">
            <option value="schedule">按时间</option>
            <option value="manual">手动</option>
          </select>
        </label>

        <label>
          当前壁纸
          <select id="manualWallpaper"></select>
        </label>

        <label>
          遮罩强度
          <input id="overlayOpacity" type="range" min="0" max="0.85" step="0.01" />
        </label>

        <label>
          聊天透明度
          <input id="chatSurfaceOpacity" type="range" min="0" max="0.85" step="0.01" />
        </label>

        <label class="checkline">
          <input id="dynamicPaused" type="checkbox" />
          暂停动态壁纸
        </label>
      </section>

      <button id="openOptions" type="button">高级设置</button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
